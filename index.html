<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式英文單字學習表格</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-titles">
                <h1>互動式英文單字學習表格</h1>
                <p class="subtitle">台大研究所英文單字總整理 (共 <span id="totalCount">0</span> 字)</p>
            </div>

            <div class="controls-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜尋單字、解釋或例句...">
                </div>

                <div class="filter-box">
                    <label for="yearFilter">來源年份：</label>
                    <select id="yearFilter">
                        <option value="all">全部年份</option>
                        <!-- Options will be populated by JS -->
                    </select>
                </div>

                <button id="exportBtn" class="btn-primary" title="匯出成 Excel">
                    <i class="fas fa-file-excel"></i> 匯出 Excel
                </button>
            </div>
        </header>

        <main class="table-container">
            <table id="vocabTable">
                <thead>
                    <tr>
                        <th class="col-word">單字</th>
                        <th class="col-meaning">詞性與解釋</th>
                        <th class="col-sentence">語境例句</th>
                        <th class="col-difficulty">單字難度</th>
                        <th class="col-year">來源年份</th>
                    </tr>
                </thead>
                <tbody id="vocabBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>

            <div id="noResults" class="no-results" style="display: none;">
                <i class="fas fa-folder-open"></i>
                <p>找不到符合條件的單字，請嘗試更換關鍵字或年份。</p>
            </div>
        </main>

        <footer>
            <p>寶可夢會計師事務所 製作 &bull; 僅供學習交流使用</p>
        </footer>
    </div>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>

</html>
